<form class="save-form" method="post" action="{% if article.pk in saved_ids or removing %}{% url 'remove_saved_article' article.pk %}{% else %}{% url 'save_article' article.pk %}{% endif %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="save-icon-button{% if article.pk in saved_ids or removing %} is-saved{% endif %}" type="submit" aria-label="{% if article.pk in saved_ids or removing %}Quitar de guardadas: {% else %}Guardar: {% endif %}{{ article.title }}" title="{% if article.pk in saved_ids or removing %}Quitar de guardadas{% else %}Guardar noticia{% endif %}">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M6.75 3.75h10.5a1.5 1.5 0 0 1 1.5 1.5v15l-6.75-4.5-6.75 4.5v-15a1.5 1.5 0 0 1 1.5-1.5Z" />
        </svg>
    </button>
</form>
