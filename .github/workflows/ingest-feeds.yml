name: Ingesta y limpieza de noticias

on:
  schedule:
    - cron: '0 0,6,8,10,12,14,16,18,20,22 * * *'
      timezone: America/Argentina/Buenos_Aires
  workflow_dispatch:
    inputs:
      mode:
        description: Flujo completo o sólo reparación del agrupamiento e importancia
        type: choice
        options: [maintenance, repair-grouping]
        default: maintenance
      grouping_limit:
        description: Máximo de titulares a agrupar en esta ejecución
        type: choice
        options: ['100', '500']
        default: '100'

permissions:
  contents: read

concurrency:
  group: news-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: vars.NEWS_INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Validar configuración
        shell: bash
        run: |
          for name in DJANGO_SECRET_KEY POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_HOST; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar $name"
              exit 1
            fi
          done
          case "$POSTGRES_HOST" in
            localhost|127.0.0.1|::1) echo 'Se requiere una base pública persistente'; exit 1 ;;
          esac
          case "$POSTGRES_SSLMODE" in
            require|verify-ca|verify-full) ;;
            *) echo 'POSTGRES_SSLMODE debe exigir SSL'; exit 1 ;;
          esac
          if [ -n "$GEMINI_API_KEY" ] && [ -z "$GEMINI_API_KEY_SECONDARY" ]; then
            echo 'IA: sólo hay clave principal; todas las funciones usarán esa clave.'
          elif [ -n "$GEMINI_API_KEY_SECONDARY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo 'IA: sólo hay segunda clave; clasificación y agrupamiento quedan pendientes.'
          fi
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar migraciones
        id: check_migrations
        run: python manage.py migrate --check
      - name: Mostrar migraciones pendientes
        if: ${{ failure() && steps.check_migrations.outcome == 'failure' }}
        run: |
          echo 'Falló el control de migraciones; revisá abajo las pendientes o un posible error de conexión.'
          python manage.py showmigrations --plan
      - name: Limpiar noticias antiguas
        id: purge
        if: inputs.mode != 'repair-grouping'
        run: python manage.py purge_old_articles
      - name: Ingerir feeds
        id: ingest
        if: inputs.mode != 'repair-grouping'
        run: python manage.py ingest_feeds
      - name: Clasificar noticias con IA
        if: inputs.mode != 'repair-grouping' && env.GEMINI_API_KEY != ''
        run: python manage.py classify_news_ai
      - name: Generar presentación de las últimas 24 horas
        if: ${{ always() && steps.check_migrations.outcome == 'success' && steps.purge.outcome == 'success' && steps.ingest.outcome == 'success' && (env.GEMINI_API_KEY_SECONDARY != '' || env.GEMINI_API_KEY != '') }}
        run: python manage.py generate_news_briefing
      - name: Comprobar identidad con titulares ficticios
        id: grouping_check
        if: inputs.mode == 'repair-grouping' && env.GEMINI_API_KEY != ''
        run: python manage.py check_news_grouping
      - name: Agrupar coberturas del mismo acontecimiento
        id: grouping
        if: ${{ always() && steps.check_migrations.outcome == 'success' && (inputs.mode == 'repair-grouping' || (steps.purge.outcome == 'success' && steps.ingest.outcome == 'success')) && env.GEMINI_API_KEY != '' && (steps.grouping_check.outcome == 'success' || steps.grouping_check.outcome == 'skipped') }}
        env:
          GROUPING_LIMIT: ${{ inputs.grouping_limit || '100' }}
        run: python manage.py group_news_ai --limit "$GROUPING_LIMIT"
      - name: Evaluar importancia general
        if: ${{ always() && steps.check_migrations.outcome == 'success' && ((inputs.mode == 'repair-grouping' && steps.grouping.outcome == 'success') || (steps.purge.outcome == 'success' && steps.ingest.outcome == 'success')) && (env.GEMINI_API_KEY_SECONDARY != '' || env.GEMINI_API_KEY != '') }}
        run: python manage.py score_news_ai
